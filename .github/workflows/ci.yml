name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 静的チェックと L1〜L3 のテスト。E2E と独立しているため並列に走らせる。
  # Playwright のブラウザ取得 (約 23 秒) がこちらの経路に乗らないので、
  # 型エラーやリントの失敗はブラウザの準備を待たずに分かる。
  check:
    name: 静的チェックとテスト (L1-L3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: mise ツールのセットアップ
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: pnpm store パスの取得
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: pnpm store のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: JavaScript / TypeScript リント (oxlint)
        run: pnpm lint

      - name: コードフォーマット検証 (oxfmt)
        run: pnpm fmt:check

      - name: Terraform フォーマット検証
        run: pnpm lint:tf

      - name: GitHub Actions pinact 検証
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pinact:check

      - name: Terraform 初期化 & 構文検証 (validate)
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            terraform init
          else
            terraform init -backend=false
          fi
          terraform validate

      - name: Terraform Plan 実行
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TF_VAR_cloudflare_api_token" ] && [ -n "$TF_VAR_cloudflare_account_id" ]; then
            terraform plan -no-color > plan.txt 2>&1 || true
            cat plan.txt
            echo "### 🏗️ Terraform Plan サマリー" >> $GITHUB_STEP_SUMMARY
            echo '```terraform' >> $GITHUB_STEP_SUMMARY
            cat plan.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Cloudflare API Token 未設定のため terraform plan をスキップします"
          fi

      # 以前はここで `pnpm test:coverage | tee` としていたが、GitHub Actions の
      # 既定シェル (bash -e) は pipefail が無効なため、テストが失敗しても
      # パイプの終了ステータスが最後のコマンドのものになり CI が緑になりえた。
      # 計測とレポート生成をステップごと分離し、パイプ自体を排除している。
      - name: テスト実行とカバレッジ計測
        run: pnpm test:coverage

      - name: 統合テスト (Worker / workerd + ローカル D1)
        run: pnpm test:worker

      - name: カバレッジレポートの生成
        if: always()
        run: pnpm coverage:report > coverage-report.md

      - name: カバレッジサマリーの出力
        if: always()
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR Conversation に CI レポート (Terraform Plan & テストカバレッジ) をコメント投稿
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COVERAGE_BODY=$(cat coverage-report.md)
          PLAN_SECTION=""
          if [ -f terraform/plan.txt ]; then
            PLAN_BODY=$(cat terraform/plan.txt)
            PLAN_SECTION="### 🏗️ Terraform Plan レポート

          \`\`\`terraform
          $PLAN_BODY
          \`\`\`

          "
          fi

          REPORT_BODY="${PLAN_SECTION}${COVERAGE_BODY}"

          gh pr comment "$PR_NUMBER" --body "$REPORT_BODY" --edit-last || gh pr comment "$PR_NUMBER" --body "$REPORT_BODY"

  # E2E は wrangler dev (ローカル workerd + ローカル D1 + 本番ビルド) に対して
  # 実行する。Cloudflare アカウントへは接続しないため、シークレット不要・
  # 無料枠の消費もない。
  #
  # 以前は PR で @smoke タグのみを回し、全シナリオは nightly (e2e.yml) に
  # 回していた。しかし実測では smoke 17 秒に対し全シナリオでも 28 秒で、
  # 大半はビルド・シード・wrangler 起動に費やされており、ケース数を
  # 5 倍にしても 11 秒しか増えない。一方で「原因の PR ではなく翌朝の main で
  # 落ちる」コストは実際に発生していた (PR #55)。全シナリオを PR で回す。
  e2e:
    name: E2E (L4)
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: mise ツールのセットアップ
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: pnpm store パスの取得
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: pnpm store のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: Playwright ブラウザのインストール
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E テスト実行 (desktop / mobile 全シナリオ)
        run: pnpm test:e2e

      - name: Playwright レポートの保存
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
