name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: mise ツールのセットアップ
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: JavaScript / TypeScript リント (oxlint)
        run: pnpm lint

      - name: コードフォーマット検証 (oxfmt)
        run: pnpm fmt:check

      - name: Terraform フォーマット検証
        run: pnpm lint:tf

      - name: テスト実行とカバレッジ計測
        run: pnpm test:coverage --reporter=json-summary --reporter=text

      - name: テストカバレッジを Step Summary に出力
        if: always()
        run: |
          echo "### 📊 テストカバレッジサマリー" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pnpm vitest run --coverage --reporter=text-summary >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
