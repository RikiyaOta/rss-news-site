name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: mise ツールのセットアップ
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: pnpm store パスの取得
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: pnpm store のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: JavaScript / TypeScript リント (oxlint)
        run: pnpm lint

      - name: コードフォーマット検証 (oxfmt)
        run: pnpm fmt:check

      - name: Terraform フォーマット検証
        run: pnpm lint:tf

      - name: テスト実行とカバレッジ計測
        run: |
          pnpm test:coverage > coverage_raw.txt 2>&1
          cat coverage_raw.txt
          sed -e 's/\x1b\[[0-9;]*m//g' coverage_raw.txt > coverage_clean.txt
          echo "### 📊 テストカバレッジサマリー" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/% Coverage report from v8/,$p' coverage_clean.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: PR Conversation にテストカバレッジをコメント投稿
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COVERAGE_BODY=$(sed -n '/% Coverage report from v8/,$p' coverage_clean.txt)
          gh pr comment "$PR_NUMBER" --body "### 📊 テストカバレッジレポート

          \`\`\`
          $COVERAGE_BODY
          \`\`\`" --edit-last || gh pr comment "$PR_NUMBER" --body "### 📊 テストカバレッジレポート

          \`\`\`
          $COVERAGE_BODY
          \`\`\`"
