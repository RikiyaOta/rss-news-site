name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: mise ツールのセットアップ
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: pnpm store パスの取得
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: pnpm store のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: JavaScript / TypeScript リント (oxlint)
        run: pnpm lint

      - name: コードフォーマット検証 (oxfmt)
        run: pnpm fmt:check

      - name: Terraform フォーマット検証
        run: pnpm lint:tf

      - name: GitHub Actions pinact 検証
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pinact:check

      - name: Terraform 初期化 & 構文検証 (validate)
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            terraform init
          else
            terraform init -backend=false
          fi
          terraform validate

      - name: Terraform Plan 実行
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TF_VAR_cloudflare_api_token" ] && [ -n "$TF_VAR_cloudflare_account_id" ]; then
            terraform plan -no-color > plan.txt 2>&1 || true
            cat plan.txt
            echo "### 🏗️ Terraform Plan サマリー" >> $GITHUB_STEP_SUMMARY
            echo '```terraform' >> $GITHUB_STEP_SUMMARY
            cat plan.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Cloudflare API Token 未設定のため terraform plan をスキップします"
          fi

      - name: テスト実行とカバレッジ計測
        run: |
          pnpm test:coverage > coverage_raw.txt 2>&1
          cat coverage_raw.txt
          sed -e 's/\x1b\[[0-9;]*m//g' coverage_raw.txt > coverage_clean.txt
          echo "### 📊 テストカバレッジサマリー" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/% Coverage report from v8/,$p' coverage_clean.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: PR Conversation に Terraform Plan をコメント投稿
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f terraform/plan.txt ]; then
            PLAN_BODY=$(cat terraform/plan.txt)
            gh pr comment "$PR_NUMBER" --body "### 🏗️ Terraform Plan レポート

            \`\`\`terraform
            $PLAN_BODY
            \`\`\`"
          fi

      - name: PR Conversation にテストカバレッジをコメント投稿
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COVERAGE_BODY=$(sed -n '/% Coverage report from v8/,$p' coverage_clean.txt)
          gh pr comment "$PR_NUMBER" --body "### 📊 テストカバレッジレポート

          \`\`\`
          $COVERAGE_BODY
          \`\`\`" --edit-last || gh pr comment "$PR_NUMBER" --body "### 📊 テストカバレッジレポート

          \`\`\`
          $COVERAGE_BODY
          \`\`\`"
