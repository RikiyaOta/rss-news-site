name: E2E Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: mise ツールのセットアップ
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: pnpm store パスの取得
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: pnpm store のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: Playwright ブラウザのインストール
        run: pnpm exec playwright install --with-deps chromium

      # 全シナリオを desktop / mobile の両プロファイルで実行する。
      # wrangler dev はローカルモードで動くため Cloudflare へは接続せず、
      # 無料枠も消費しない。
      #
      # 実 Workers AI まで通したい場合は wrangler.e2e.jsonc の ai バインディング
      # (experimental_remote) を有効にし、CLOUDFLARE_API_TOKEN / ACCOUNT_ID を渡す。
      # AI のみリモートで D1 はローカルのままなので、本番データには触れない。
      - name: E2E テスト実行
        run: pnpm test:e2e

      - name: Playwright レポートの保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
