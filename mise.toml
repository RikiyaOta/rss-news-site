[settings]
minimum_release_age = "7d"

[tools]
node = "26.12.1"
pnpm = "12.14.0"
terraform = "1.16.6"
tflint = "0.64.0"
"github:suzuki-shunsuke/pinact" = "v5.0.0"

# `pnpm up --latest` は上げてはいけない依存まで上げるため、手動更新はこちらを使う。
# 何を除外しているか・いつ除外を外せるかはスクリプト冒頭のコメントを参照。
[tasks."deps:update"]
description = "mise のツールと pnpm の依存を、制約を守って最新にする"
run = "bash scripts/update-deps.sh"
